hostname r1

int r1-eth0
  ip address 192.0.2.1/24
!
int dummy0
  ip address 10.0.4.1/24
  no shut
!
int dummy5
  ip address 10.0.5.1/24
  no shut
!
int NONNA
  no shut
!
hostname r1

router bgp 65500 vrf NONNA
  no bgp ebgp-requires-policy
  address-family ipv4 unicast
    redistribute connected
    rd vpn export 65500:100
    rt vpn export 65500:110
    export vpn
  !
!
